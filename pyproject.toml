[project]
name = "hund-cli"
version = "0.1.0"
description = "Hund — en installerbar, local-first, self-improving CLI-agentmotor som lever i hårdvaran."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "William" }]
keywords = ["cli", "agent", "local-first", "self-improving"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
]

[project.scripts]
hund = "hund_cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.urls]
Documentation = "https://github.com/dopaminedotmd/hund-cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hund_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
