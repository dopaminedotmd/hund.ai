[project]
name = "hund"
version = "0.1.0"
description = "Hund — ett installerbar, self-improving CLI-agent-skal. Ger illusionen av att vara en del av din maskin."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "William" }]
keywords = ["cli", "agent", "self-improving", "ai-shell"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
    "duckduckgo-search>=8.1.1",
]

[project.scripts]
hund = "hund.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.urls]
Documentation = "https://github.com/dopaminedotmd/hund.ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hund"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
